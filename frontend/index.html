<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Student Management</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <header>
        <h1>🎓 Student Management System</h1>
    </header>

    <main>
        <!-- FORM SECTION -->
        <section class="form-section">
            <h2 id="form-title">Add New Student</h2>
            <form id="student-form">
                <input type="hidden" id="student-id" />

                <div class="form-grid">
                    <div class="field">
                        <label>Full Name *</label>
                        <input type="text" id="name" placeholder="e.g. Parth Patel" required />
                    </div>
                    <div class="field">
                        <label>Roll Number *</label>
                        <input type="text" id="roll_no" placeholder="e.g. CS2101" required />
                    </div>
                    <div class="field">
                        <label>Email *</label>
                        <input type="email" id="email" placeholder="e.g. parth@college.com" required />
                    </div>
                    <div class="field">
                        <label>Phone</label>
                        <input type="text" id="phone" placeholder="e.g. 9876543210" />
                    </div>
                    <div class="field">
                        <label>Department</label>
                        <input type="text" id="department" placeholder="e.g. Computer Science" />
                    </div>
                    <div class="field">
                        <label>Year</label>
                        <select id="year">
                            <option value="">-- Select Year --</option>
                            <option value="1">1st Year</option>
                            <option value="2">2nd Year</option>
                            <option value="3">3rd Year</option>
                            <option value="4">4th Year</option>
                        </select>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" id="submit-btn">➕ Add Student</button>
                    <button type="button" id="cancel-btn" class="hidden" onclick="resetForm()">✖ Cancel</button>
                </div>
            </form>
            <p id="form-message"></p>
        </section>

        <!-- TABLE SECTION -->
        <section class="table-section">
            <div class="table-header">
                <h2>All Students</h2>
                <button onclick="loadStudents()">🔄 Refresh</button>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Roll No</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Department</th>
                            <th>Year</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="student-table-body">
                        <tr><td colspan="8" class="empty">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
